[env:esp32-s3-devkitc-1]
; IDF 5.5 keeps the USB host library in the core framework. In IDF 6.x it
; moved into a separately managed component, which PlatformIO cannot resolve
; from an idf_component.yml in this project layout.
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_port = /dev/ttyUSB3
monitor_port = /dev/ttyUSB3
; Override the generic N8 board profile only after confirming the module's
; actual flash size. Do not upload an 8 MB build to a 2 MB module.
board_build.flash_size = 2MB
board_upload.flash_size = 2MB

; Build this in its own directory: pio run -d esp32_usb_probe
; The UART bridge remains free for logging while the native USB port is host.
