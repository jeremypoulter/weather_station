name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to notice ESPHome API changes even when this repository is quiet.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  python-and-decoder:
    name: Python tests and C++ decoder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: pip install -r python/requirements.txt
      # Includes test_esphome_decoder.py, which compiles the C++ decoder used by
      # the ESPHome component and compares it with the Python reference.
      - run: python -m unittest discover -s python -v

  esphome:
    name: ESPHome build (${{ matrix.esphome }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - esphome: "2026.9.1"   # version the component was developed and tested against
            experimental: false
          - esphome: latest      # early warning for upstream usb_host changes
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: |
          if [ "${{ matrix.esphome }}" = "latest" ]; then
            pip install esphome
          else
            pip install "esphome==${{ matrix.esphome }}"
          fi
          esphome version
      - name: Cache PlatformIO and ESP-IDF
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/esphome
          key: esphome-${{ matrix.esphome }}-${{ hashFiles('esphome/ft0203.yaml') }}
          restore-keys: esphome-${{ matrix.esphome }}-
      - name: Create placeholder secrets
        working-directory: esphome
        run: |
          cp secrets.yaml.example secrets.yaml
          sed -i "s|^api_encryption_key:.*|api_encryption_key: \"$(openssl rand -base64 32)\"|" secrets.yaml
      - name: Compile firmware
        working-directory: esphome
        run: esphome compile ft0203.yaml
